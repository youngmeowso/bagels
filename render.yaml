# Render Blueprint (FREE): New + > Blueprint > pick your GitHub repo
services:
  - type: web
    name: bagel-royale
    runtime: node
    plan: free
    buildCommand: echo "no build step - zero dependencies"
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: SECRET                      # signs login tokens - Render generates it once
        generateValue: true
      - key: UPSTASH_REDIS_REST_URL      # free database for accounts (see README) - paste in the Render dashboard
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
